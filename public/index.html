<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <!-- Viewport & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Theme color -->
    <meta name="theme-color" content="#0a1128" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: dark)" />
    <!-- SEO -->
    <meta name="description" content="Sachin Yoganandham — Data Analyst & Front-End Engineer" />
    <meta name="author" content="Sachin Yoganandham" />
    <title>Sachin Portfolio</title>

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Manifest for PWA (if you add one) -->
    <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->

    <!-- Inline script to set initial theme class before CSS loads -->
    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light';
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <!-- Fallback for no-JS -->
    <noscript>
      <strong>JavaScript is disabled.</strong> This site works best with JavaScript enabled.
    </noscript>

    <div id="root"></div>

    <!-- CRA will inject CSS & JS bundles here in production -->
  </body>
</html>
